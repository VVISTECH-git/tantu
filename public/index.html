<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saree Render Test</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--fg:#1f1b16;--muted:#6b6258;--line:#e6e0d8;--accent:#9a3b2e;--accent-fg:#fff;--err:#b42318;--ok:#1d7a46}
@media (prefers-color-scheme:dark){:root{--bg:#141210;--card:#1d1a17;--fg:#f1ece6;--muted:#a59b90;--line:#332e29;--accent:#d9775f;--accent-fg:#141210;--err:#f97066;--ok:#47cd89}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
input[type=text],input[type=password]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
input[type=file]{width:100%;font-size:13px;color:var(--muted)}
.checks label{display:flex;gap:8px;align-items:center;font-weight:400;font-size:14px;margin:4px 0;word-break:break-all}
.thumb{margin-top:8px;max-height:140px;max-width:100%;border-radius:8px;display:none}
button{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:10px 18px;font:600 15px system-ui;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#status{margin-left:12px;color:var(--muted)}
.results{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.res .img{aspect-ratio:3/4;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.res img{width:100%;height:100%;object-fit:cover;display:block}
.res .meta{padding:10px 12px;font-size:12px;color:var(--muted)}
.res .meta b{color:var(--fg);font-size:13px;display:block;word-break:break-all}
.err{color:var(--err)}
.res a{color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>Saree render test</h1>
  <p class="sub">Uploads a saree photo and renders catalog poses on Gemini image models, using the first render as the identity anchor.</p>

  <div class="card">
    <div class="grid">
      <div>
        <label for="garment">Saree photo (required)</label>
        <input type="file" id="garment" accept="image/*">
        <img id="garmentThumb" class="thumb" alt="">
      </div>
      <div>
        <label for="blouse">Blouse photo (optional)</label>
        <input type="file" id="blouse" accept="image/*">
        <img id="blouseThumb" class="thumb" alt="">
      </div>
      <div>
        <label for="skin">Model skin tone</label>
        <input type="text" id="skin" value="medium-wheatish">
        <label for="region" style="margin-top:10px">Model region</label>
        <input type="text" id="region" value="South Indian">
      </div>
    </div>
    <div class="grid" style="margin-top:14px">
      <div class="checks"><label>Models</label><div id="models">Loading…</div></div>
      <div class="checks"><label>Poses</label>
        <label><input type="checkbox" name="pose" value="front" checked> Front</label>
        <label><input type="checkbox" name="pose" value="three-quarter" checked> Three-quarter</label>
        <label><input type="checkbox" name="pose" value="back" checked> Back</label>
        <label><input type="checkbox" name="pose" value="side"> Side</label>
      </div>
      <div id="pwWrap" class="hidden">
        <label for="pw">Access password</label>
        <input type="password" id="pw" autocomplete="current-password">
      </div>
    </div>
    <div style="margin-top:16px;display:flex;align-items:center;flex-wrap:wrap">
      <button id="go">Generate</button><span id="status"></span>
    </div>
  </div>

  <div id="results" class="results"></div>

  <div id="summary" class="card hidden" style="margin-top:16px;overflow-x:auto">
    <table><thead><tr><th>Model</th><th>Pose</th><th class="n">Secs</th><th class="n">In tok</th><th class="n">Out tok</th><th class="n">Est. ₹</th></tr></thead><tbody id="rows"></tbody>
    <tfoot><tr><th colspan="5">Total estimate</th><th class="n" id="total">₹0.00</th></tr></tfoot></table>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
try { $('pw').value = localStorage.getItem('pw') || ''; } catch (e) {}

fetch('/api/generate').then(r => r.json()).then(cfg => {
  $('models').innerHTML = '';
  (cfg.models || []).forEach((m, i) => {
    const l = document.createElement('label');
    l.innerHTML = `<input type="checkbox" name="model" value="${m}" ${i === 0 ? 'checked' : ''}> ${m}`;
    $('models').appendChild(l);
  });
  if (cfg.passwordRequired) $('pwWrap').classList.remove('hidden');
}).catch(() => { $('models').textContent = 'Could not reach the API.'; });

// Resize to a max edge and re-encode as JPEG so requests stay under Vercel's 4.5 MB limit.
function toJpeg(src, max = 1280, q = 0.88) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', q);
      resolve({ mimeType: 'image/jpeg', data: url.split(',')[1] });
    };
    img.onerror = () => reject(new Error('Could not read image'));
    img.src = src;
  });
}
const fileUrl = f => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });

['garment', 'blouse'].forEach(id => $(id).addEventListener('change', async () => {
  const f = $(id).files[0], t = $(id + 'Thumb');
  if (f) { t.src = await fileUrl(f); t.style.display = 'block'; } else t.style.display = 'none';
}));

function card(model, pose) {
  const d = document.createElement('div');
  d.className = 'res';
  d.innerHTML = `<div class="img">Waiting…</div><div class="meta"><b>${pose}</b>${model}</div>`;
  $('results').appendChild(d);
  return d;
}

$('go').addEventListener('click', async () => {
  const gf = $('garment').files[0];
  const models = [...document.querySelectorAll('input[name=model]:checked')].map(x => x.value);
  const poses = [...document.querySelectorAll('input[name=pose]:checked')].map(x => x.value);
  if (!gf) return ($('status').textContent = 'Add a saree photo first.');
  if (!models.length || !poses.length) return ($('status').textContent = 'Pick at least one model and one pose.');
  try { localStorage.setItem('pw', $('pw').value); } catch (e) {}

  $('go').disabled = true; $('results').innerHTML = ''; $('rows').innerHTML = '';
  $('summary').classList.remove('hidden');
  let total = 0;
  const garment = await toJpeg(await fileUrl(gf));
  const blouse = $('blouse').files[0] ? await toJpeg(await fileUrl($('blouse').files[0])) : undefined;
  const cards = {};
  models.forEach(m => poses.forEach(p => cards[m + p] = card(m, p)));

  for (const model of models) {
    let anchor;
    for (const pose of poses) {
      const c = cards[model + pose], box = c.querySelector('.img');
      box.textContent = 'Rendering…';
      $('status').textContent = `${model} · ${pose}`;
      try {
        const r = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-access-password': $('pw').value },
          body: JSON.stringify({ model, pose, garment, blouse, anchor, skin: $('skin').value, region: $('region').value }),
        });
        const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
        if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
        if (j.image) {
          const src = `data:${j.image.mimeType};base64,${j.image.data}`;
          box.innerHTML = `<img src="${src}" alt="${pose} render">`;
          c.querySelector('.meta').insertAdjacentHTML('beforeend', `<br><a download="${model}_${pose}.${j.image.mimeType.split('/')[1]}" href="${src}">Download</a>`);
          if (!anchor) anchor = await toJpeg(src, 1024, 0.9);
        } else {
          box.innerHTML = `<span class="err">No image returned${j.finish ? ' (' + j.finish + ')' : ''}${j.text ? ': ' + j.text.slice(0, 160) : ''}</span>`;
        }
        total += Number(j.inr || 0);
        $('rows').insertAdjacentHTML('beforeend', `<tr><td>${model}</td><td>${pose}</td><td class="n">${j.secs}</td><td class="n">${j.inTok}</td><td class="n">${j.outTok}</td><td class="n">₹${j.inr}</td></tr>`);
        $('total').textContent = `₹${total.toFixed(2)}`;
      } catch (e) {
        box.innerHTML = `<span class="err"></span>`;
        box.firstChild.textContent = e.message;
        if (/password/i.test(e.message)) { $('pwWrap').classList.remove('hidden'); break; }
      }
    }
  }
  $('status').textContent = 'Done.';
  $('go').disabled = false;
});
</script>
</body>
</html>
